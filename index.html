<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriMate AI — شريكك الذكي في الزراعة وإدارة الأراضي</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Leaflet.js for Interactive Satellite & Field Maps -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Chart.js for Reports & Visual Analytics -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --g: #245C43;
  --g-light: #2e7556;
  --sage: #E8F0E8;
  --bg: #F4F3EA;
  --card: #ffffff;
  --tx: #1d2a24;
  --mut: #5d6b63;
  --bd: #d9e0d6;
  --warn: #9a5b13;
  --warnbg: #f6ead6;
  --bad: #a23b2c;
  --badbg: #f5dfdb;
  --good: #1f7d49;
  --goodbg: #e1f5e8;
  --accent: #2b7a78;

  /* Animation Timing & Easing Variables */
  --anim-fast: 180ms;
  --anim-normal: 300ms;
  --anim-slow: 500ms;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --g: #6fb28f;
    --g-light: #83c7a3;
    --sage: #22332a;
    --bg: #151c18;
    --card: #1c2620;
    --tx: #e8efe9;
    --mut: #9fb0a5;
    --bd: #2f3d34;
    --warn: #e0b070;
    --warnbg: #3a2f1c;
    --bad: #e59a8c;
    --badbg: #3d2420;
    --good: #72cca0;
    --goodbg: #1d3527;
    --accent: #5ab3b0;
  }
}

:root[data-theme="dark"] {
  --g: #6fb28f;
  --g-light: #83c7a3;
  --sage: #22332a;
  --bg: #151c18;
  --card: #1c2620;
  --tx: #e8efe9;
  --mut: #9fb0a5;
  --bd: #2f3d34;
  --warn: #e0b070;
  --warnbg: #3a2f1c;
  --bad: #e59a8c;
  --badbg: #3d2420;
  --good: #72cca0;
  --goodbg: #1d3527;
  --accent: #5ab3b0;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Mobile First Base Layout */
html {
  scroll-padding-top: calc(70px + env(safe-area-inset-top, 0px));
  scroll-behavior: smooth;
  overflow-x: hidden;
  width: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 15px/1.6 Cairo, system-ui, -apple-system, sans-serif;
  transition: background var(--anim-normal) var(--ease), color var(--anim-normal) var(--ease);
  overflow-x: hidden;
  width: 100%;
  min-height: 100vh;
}
[dir="ltr"] body, [dir="ltr"] button, [dir="ltr"] input, [dir="ltr"] select, [dir="ltr"] textarea {
  font-family: Figtree, system-ui, -apple-system, sans-serif;
}

/* Typography with clamp() for smooth fluid scaling */
h1 {
  font-size: clamp(1.25rem, 4.5vw, 1.75rem);
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--tx);
  line-height: 1.25;
}
h2 {
  font-size: clamp(1.05rem, 3vw, 1.25rem);
  margin: 0 0 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.35;
}
h3 {
  font-size: clamp(0.95rem, 2.5vw, 1.15rem);
}
.sub {
  color: var(--mut);
  margin: 2px 0 14px;
  font-size: clamp(12.5px, 2.5vw, 14px);
  line-height: 1.5;
}

/* Touch friendly inputs (minimum 16px to prevent iOS auto-zoom) */
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
input[type="text"], input[type="password"], input[type="number"], select, textarea {
  font-size: 16px !important;
  min-height: 44px;
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--tx);
  transition: border-color var(--anim-fast) var(--ease), box-shadow var(--anim-fast) var(--ease);
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--g);
  box-shadow: 0 0 0 3px rgba(36,92,67,0.18);
}

.app {
  display: flex;
  min-height: 100vh;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  position: relative;
}

/* Drawer Backdrop for Mobile */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(3px);
  z-index: 199;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--anim-normal) var(--ease);
}
.drawer-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

/* Sidebar Navigation - Mobile Drawer as Default */
aside {
  position: fixed;
  z-index: 200;
  inset-block: 0;
  inset-inline-start: 0;
  width: min(280px, 82vw);
  background: var(--card);
  border-inline-end: 1px solid var(--bd);
  padding: 20px 14px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform var(--anim-normal) var(--ease), box-shadow var(--anim-normal) var(--ease);
  box-shadow: none;
}
[dir="ltr"] aside {
  transform: translateX(-100%);
}
aside.o {
  transform: translateX(0) !important;
  box-shadow: 0 0 35px rgba(0, 0, 0, 0.28);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  font-weight: 800;
  font-size: 18px;
  color: var(--g);
  padding: 4px 8px 16px;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 12px;
}
.brand-sub { font-size: 11px; color: var(--mut); font-weight: normal; margin-top: -2px; }
.logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--g);
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  transition: transform var(--anim-normal) var(--ease-bounce);
}
.brand:hover .logo { transform: rotate(8deg) scale(1.05); }

/* Navigation Buttons with Animated Active Indicator */
nav button {
  display: flex;
  gap: 12px;
  align-items: center;
  width: 100%;
  background: none;
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  margin-bottom: 4px;
  min-height: 44px;
  cursor: pointer;
  color: var(--mut);
  text-align: start;
  position: relative;
  overflow: hidden;
  transition: background var(--anim-fast) var(--ease), color var(--anim-fast) var(--ease), transform var(--anim-fast) var(--ease);
}
nav button::before {
  content: "";
  position: absolute;
  inset-block: 8px;
  inset-inline-start: 2px;
  width: 4px;
  border-radius: 4px;
  background: var(--g);
  transform: scaleY(0);
  transition: transform var(--anim-normal) var(--ease-bounce);
}
nav button:hover { background: var(--sage); color: var(--g); }
nav button:active { transform: scale(0.97); }
nav button[aria-current="page"] {
  background: var(--sage);
  color: var(--g);
  font-weight: 700;
}
nav button[aria-current="page"]::before {
  transform: scaleY(1);
}
nav svg { width: 19px; height: 19px; flex: none; transition: transform var(--anim-fast) var(--ease); }
nav button:hover svg { transform: scale(1.1); }

/* Main Content Area */
main {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 16px 14px 95px;
  overflow-x: hidden;
}

/* Header */
header {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  margin-bottom: 8px;
  padding-bottom: 8px;
  position: relative;
  z-index: 10;
}
.header-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

/* Buttons (Touch targets >= 44x44px) */
.btn {
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: 10px;
  padding: 9px 14px;
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
  position: relative;
  overflow: hidden;
  transition: transform var(--anim-fast) var(--ease), background var(--anim-fast) var(--ease), border-color var(--anim-fast) var(--ease), box-shadow var(--anim-fast) var(--ease);
}
.btn:hover { background: var(--sage); border-color: var(--g); }
.btn:active { transform: scale(0.96) !important; }
.btn.p {
  background: var(--g);
  border-color: var(--g);
  color: #fff;
  box-shadow: 0 2px 8px rgba(36,92,67,0.25);
}
.btn.p:hover { background: var(--g-light); border-color: var(--g-light); box-shadow: 0 4px 12px rgba(36,92,67,0.35); }
[data-theme="dark"] .btn.p { color: #10231a; }
.btn.sm {
  padding: 7px 11px;
  font-size: 13px;
  min-height: 40px;
}
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:hover { background: var(--badbg); }

/* Ripple Effect Animation */
.ripple-effect {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.45);
  transform: scale(0);
  animation: rippleAnim 450ms linear;
  pointer-events: none;
}
[data-theme="dark"] .ripple-effect { background: rgba(255, 255, 255, 0.25); }
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  background: var(--sage);
  color: var(--g);
  transition: transform var(--anim-fast) var(--ease);
}
.tag.w { background: var(--warnbg); color: var(--warn); }
.tag.b { background: var(--badbg); color: var(--bad); }
.tag.g { background: var(--goodbg); color: var(--good); }

.banner {
  background: var(--sage);
  color: var(--g);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13.5px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  transition: transform var(--anim-normal) var(--ease);
}
.banner.warn { background: var(--warnbg); color: var(--warn); border-color: rgba(154,91,19,0.25); }

/* Grids - Mobile First (Default 1 column) */
.grid { display: grid; gap: 14px; grid-template-columns: 1fr; width: 100%; }
.g4, .g3, .g2 { grid-template-columns: 1fr; }

/* Responsive Breakpoints */
@media (min-width: 480px) {
  .g4 { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  main { padding: 18px 20px 95px; }
}
@media (min-width: 768px) {
  .g3 { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .g2 { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  main { padding: 20px 24px 95px; }
}
@media (min-width: 1024px) {
  aside {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 250px;
    transform: none !important;
    box-shadow: none !important;
    z-index: 100;
  }
  aside.c { width: 70px; }
  aside.c .lb, aside.c .brand span, aside.c .brand-sub { display: none; }
  aside.c .brand { justify-content: center; padding-inline: 0; }
  .drawer-backdrop { display: none !important; }
  main { padding: 24px 32px 100px; }
  .g4 { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .g3 { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .g2 { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}

/* Card Styling & Smooth Hover Lift (Desktop only) */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  position: relative;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  transition: transform var(--anim-normal) var(--ease), box-shadow var(--anim-normal) var(--ease), border-color var(--anim-fast) var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    border-color: rgba(36,92,67,0.25);
  }
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat b {
  display: block;
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 800;
  color: var(--g);
  line-height: 1.15;
  margin: 4px 0 2px;
  transition: transform var(--anim-fast) var(--ease);
}
.stat span { color: var(--mut); font-size: 13px; font-weight: 600; }
.stat .trend { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

.meta { font-size: 12.5px; color: var(--mut); margin-top: 8px; line-height: 1.5; word-break: break-word; }

/* Progress Bar with Animation */
.bar { height: 8px; border-radius: 9px; background: var(--sage); overflow: hidden; margin-top: 6px; width: 100%; }
.bar i {
  display: block;
  height: 100%;
  background: var(--g);
  border-radius: 9px;
  width: 0%;
  transition: width 900ms var(--ease);
}

.alert {
  border-inline-start: 4px solid var(--warn);
  padding: 10px 14px;
  background: var(--warnbg);
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 13.5px;
  line-height: 1.5;
  word-break: break-word;
}
.alert.b { border-color: var(--bad); background: var(--badbg); }
.alert.g { border-color: var(--good); background: var(--goodbg); }

/* Pulse animation for critical items */
@keyframes subtlePulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.02); opacity: 0.93; }
}
.alert.b { animation: subtlePulse 3.5s infinite ease-in-out; }

/* Table & Wide Container Scroll */
table { width: 100%; border-collapse: collapse; min-width: 500px; }
th, td { text-align: start; padding: 11px 10px; border-bottom: 1px solid var(--bd); font-size: 14px; }
th { color: var(--mut); font-weight: 700; background: rgba(0,0,0,0.01); }
tbody tr:hover { background: rgba(0,0,0,0.015); }
.scroll {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* Map & Canvas Responsive Constraints */
.map-container {
  width: 100%;
  max-width: 100%;
  height: clamp(280px, 45vh, 400px);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--bd);
  position: relative;
  z-index: 1;
}
canvas {
  max-width: 100% !important;
  height: auto !important;
}

/* Chat & AI */
.chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: clamp(300px, 45vh, 420px);
  overflow-y: auto;
  padding: 10px 6px;
  scroll-behavior: smooth;
  width: 100%;
}
.m {
  max-width: 86%;
  padding: 11px 16px;
  border-radius: 16px;
  background: var(--sage);
  line-height: 1.6;
  font-size: 14px;
  animation: messageIn var(--anim-normal) var(--ease);
  word-break: break-word;
}
.m.u {
  align-self: flex-end;
  background: var(--g);
  color: #fff;
  border-bottom-inline-end-radius: 4px;
}
[data-theme="dark"] .m.u { color: #10231a; }
.m.bot {
  align-self: flex-start;
  border-bottom-inline-start-radius: 4px;
  border: 1px solid var(--bd);
}
@keyframes messageIn {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  align-items: center;
  width: 100%;
  flex-wrap: wrap;
}

.chk {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 11px 8px;
  border-bottom: 1px solid var(--bd);
  cursor: pointer;
  border-radius: 8px;
  min-height: 44px;
  transition: background var(--anim-fast) var(--ease);
}
.chk:hover { background: rgba(0,0,0,0.02); }
.chk.d span { text-decoration: line-through; color: var(--mut); }
.chk input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--g); cursor: pointer; }

/* Floating Action Button with Animated Pulse */
.fab {
  position: fixed;
  inset-inline-end: 20px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--g);
  color: #fff;
  border: 0;
  border-radius: 99px;
  padding: 12px 20px;
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(36,92,67,0.35);
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 99;
  min-height: 48px;
  animation: pulseFabAnim 4s infinite var(--ease);
  transition: transform var(--anim-fast) var(--ease), box-shadow var(--anim-fast) var(--ease);
}
[data-theme="dark"] .fab { color: #10231a; }
@keyframes pulseFabAnim {
  0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 6px 20px rgba(36,92,67,0.35); }
  50% { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 28px rgba(36,92,67,0.5); }
}

/* Modal with max-height: 90dvh & Smooth Scale Transition */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 12px;
  animation: modalBackdropFadeIn var(--anim-fast) var(--ease) forwards;
}
.modal {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: clamp(16px, 4vw, 24px);
  max-width: min(92vw, 480px);
  width: 100%;
  max-height: 90dvh;
  overflow-y: auto;
  box-shadow: 0 16px 40px rgba(0,0,0,0.22);
  animation: modalPopIn var(--anim-normal) var(--ease-bounce) forwards;
}
.modal h3 { margin: 0 0 14px; font-weight: 800; color: var(--g); }
.form-group { margin-bottom: 14px; width: 100%; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--mut); }

@keyframes modalBackdropFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalPopIn { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Scroll Reveal Classes (GPU Accelerated) */
.reveal {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity var(--anim-normal) var(--ease), transform var(--anim-normal) var(--ease);
  will-change: opacity, transform;
}
.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}
.reveal[data-delay="1"] { transition-delay: 80ms; }
.reveal[data-delay="2"] { transition-delay: 160ms; }
.reveal[data-delay="3"] { transition-delay: 240ms; }
.reveal[data-delay="4"] { transition-delay: 320ms; }

/* Weather Card specifics */
.wx-day {
  flex: 1;
  min-width: 65px;
  text-align: center;
  padding: 10px 4px;
  border-radius: 10px;
  background: var(--sage);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  transition: transform var(--anim-fast) var(--ease);
}
.wx-icon { font-size: 24px; line-height: 1; }

/* Respect user's motion preference */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .reveal { opacity: 1 !important; transform: none !important; }
  .fab { animation: none !important; }
  .alert.b { animation: none !important; }
}
</style>
</head>
<body>

<!-- Backdrop Overlay for Mobile Drawer -->
<div id="sbBackdrop" class="drawer-backdrop" onclick="toggleSidebar(false)"></div>

<div class="app">
  <!-- Sidebar -->
  <aside id="sb">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F3EA" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 21V9M12 13c-4 0-6-2-6-6 4 0 6 2 6 6zM12 15c3 0 5-1.5 5-5-3.5 0-5 1.5-5 5z"/>
        </svg>

// Open-Meteo Weather Fetcher
async function fetchOpenMeteoWeather(lat, lon) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,uv_index_max&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    liveWeather = data;
    setStorage('weather_cache', { data, time: Date.now() });
    return data;
  } catch(e) {
    console.warn("Open-Meteo fetch error, using cached or fallback:", e);
    const cached = getStorage('weather_cache', null);
    if (cached && cached.data) {
      liveWeather = cached.data;
      return liveWeather;
    }
    // Realistic fallback for Delta Egypt
    liveWeather = {
      current: {
        temperature_2m: 29.4,
        relative_humidity_2m: 48,
        apparent_temperature: 31.0,
        precipitation: 0.0,
        weather_code: 0,
        wind_speed_10m: 14.2
      },
      daily: {
        time: ["اليوم", "غداً", "الأربعاء", "الخميس", "الجمعة", "السبت", "الأحد"],
        temperature_2m_max: [31, 33, 36, 38, 35, 32, 30],
        temperature_2m_min: [18, 19, 21, 23, 21, 19, 18],
        precipitation_sum: [0, 0, 0, 0, 0, 0, 0],
        weather_code: [0, 0, 1, 1, 2, 0, 0]
      }
    };
    return liveWeather;
  }
}

// NASA POWER Agroclimatology Fetcher
async function fetchNASAPowerData(lat, lon) {
  try {
    const d = new Date();
    const end = d.toISOString().slice(0,10).replace(/-/g,'');
    d.setDate(d.getDate() - 10);
    const start = d.toISOString().slice(0,10).replace(/-/g,'');
    const url = `https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,RH2M,PRECTOTCORR,ALLSKY_SFC_SW_DWN,GWETROOT,GWETTOP&community=AG&longitude=${lon}&latitude=${lat}&start=${start}&end=${end}&format=JSON`;
    
    // Timeout of 6s to keep page snappy
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tid);
    
    if (!res.ok) throw new Error("NASA API " + res.status);
    const data = await res.json();
    liveNASA = data;
    setStorage('nasa_cache', { data, time: Date.now() });
    return data;
  } catch(e) {
    console.warn("NASA POWER fetch fallback:", e);
    const cached = getStorage('nasa_cache', null);
    if (cached && cached.data) {
      liveNASA = cached.data;
      return liveNASA;
    }
    liveNASA = {
      properties: {
        parameter: {
          GWETROOT: { latest: 0.24 }, // Root Zone Soil Wetness (0-1)
          GWETTOP: { latest: 0.21 },  // Surface Soil Wetness (0-1)
          ALLSKY_SFC_SW_DWN: { latest: 18.5 }, // Solar Radiation MJ/m^2/day
          PRECTOTCORR: { latest: 0.0 }
        }
      }
    };
    return liveNASA;
  }
}

/* ==============================================================
   LEAFLET MAP INTEGRATION
   ============================================================== */

function initLeafletMap(containerId, centerCoords = [coords.lat, coords.lon], zoom = 14) {
  const container = document.getElementById(containerId);
  if (!container) return null;

  // Cleanup existing map if any
  if (container._leaflet_id) {
    try {
      container._leaflet_map?.remove();
    } catch(e) {}
    container._leaflet_id = null;
    container.innerHTML = "";
  }

  const map = L.map(containerId, {
    zoomControl: true,
    scrollWheelZoom: false
  }).setView(centerCoords, zoom);
  container._leaflet_map = map;

  // Layer 1: Esri Satellite World Imagery (Default)
  const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri & NASA',
    maxZoom: 19
  });

  // Layer 2: OpenStreetMap
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  });

  esriSatellite.addTo(map);

  // Layer Switcher Control
  const baseMaps = {
    "🛰️ قمر صناعي (Satellite)": esriSatellite,
    "🗺️ خريطة الطرق (Street)": osm
  };
  L.control.layers(baseMaps).addTo(map);

  // Plot Farm Polygons & Markers
  farmsData.forEach(f => {
    if (f.coords && f.coords.length > 0) {
      const polygon = L.polygon(f.coords, {
        color: '#245C43',
        weight: 2,
        fillColor: '#34d399',
        fillOpacity: 0.45
      }).addTo(map);

      polygon.bindPopup(`
        <div style="font-family:Cairo,sans-serif;direction:${L==='ar'?'rtl':'ltr'};padding:4px">
          <b style="font-size:15px;color:#245C43">🌾 ${L==='ar'?f.name:(f.nameEn||f.name)}</b><br>
          <div style="margin:4px 0"><b>${L==='ar'?'المحصول:':'Crop:'}</b> ${L==='ar'?f.crop:(f.cropEn||f.crop)}</div>
          <div><b>${L==='ar'?'المساحة:':'Area:'}</b> ${f.area} فدان</div>
          <div><b>NDVI:</b> <span style="color:#245C43;font-weight:bold">${f.ndvi}</span></div>
          <div style="margin-top:6px;font-size:12px;color:#666">${L==='ar'?'رطوبة جيدة • جاهز للتسميد':'Vigorous canopy'}</div>
        </div>
      `);
    }
  });

  // Center on first farm if available
  if (farmsData[0]?.coords?.[0]) {
    map.setView(farmsData[0].coords[0], 14);
  }

  setTimeout(() => { map.invalidateSize(); }, 200);
  return map;
}

/* ==============================================================
   AI CHAT ENGINE (Gemini API & OpenAI API + Local Expert)
   ============================================================== */

async function callAI(userPrompt, imageBase64 = null) {
  // Mode 0: Secure Backend API Proxy (Keeps API Keys 100% Hidden & Protected on Server)
  try {
    const res = await fetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: userPrompt })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.success && data.reply) {
        return data.reply;
      }
    }
  } catch(e) {
    // Offline or standalone file mode fallback
  }

  // Mode 1: Google Gemini API
  if (aiConfig.provider === 'gemini' && aiConfig.geminiKey) {
    const model = aiConfig.geminiModel || 'gemini-1.5-flash';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${aiConfig.geminiKey}`;
    
    const parts = [{ text: userPrompt }];
    if (imageBase64) {
      const mime = imageBase64.split(';')[0].split(':')[1];
      const b64 = imageBase64.split(',')[1];
      parts.push({
        inline_data: { mime_type: mime, data: b64 }
      });
    }

    const sysPrompt = "أنت AgriMate AI، مستشار ومهندس زراعي خبير متخصص في الزراعة الدقيقة والمحاصيل المصرية والعربية وتحليل بيانات أقمار NASA الفضائية (SMAP، Sentinel-2، MODIS) وإدارة الري والتسميد والآفات. تحدث بأسلوب عملي وناصح وودود ومحترم (مثل 'يا حاج' أو 'يا باشمهندس')، وقدم حلولاً عملية بجرعات وتوقيتات محددة.";

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: parts }],
        systemInstruction: { parts: [{ text: sysPrompt }] }
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً يا حاج، لم يتم استلام رد كافٍ.";
  }

  // Mode 2: OpenAI API
  if (aiConfig.provider === 'openai' && aiConfig.openaiKey) {
    const model = aiConfig.openaiModel || 'gpt-4o-mini';
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${aiConfig.openaiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: 'أنت AgriMate AI، مستشار ومهندس زراعي ذكي للمزارعين المصريين والعرب، تقدم إرشادات الري والتسميد ومكافحة الآفات وتحليل بيانات NASA بأسلوب مبسط وعلمي.' },
          { role: 'user', content: userPrompt }
        ]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data.choices?.[0]?.message?.content || "عذراً يا حاج، لم يتم استلام رد.";
  }

  // Mode 3: Built-in Smart Expert System (No Key Needed)
  return generateBuiltinAgriResponse(userPrompt);
}

function generateBuiltinAgriResponse(q) {
  const qLower = q.toLowerCase();
  
  if (qLower.includes('اصفرار') || qLower.includes('صفراء') || qLower.includes('ورق')) {
    return `يا حاج، اصفرار الأوراق له ثلاث حالات رئيسية:
1. **اصفرار الأوراق السفلية القديمة أولاً:** هذا نقص مؤكد في عنصر **النيتروجين (الأزوت)**، وعلاجه إضافة سلفات نشادر بمعدل 100 كجم/فدان مع الري القادم، أو رش يوريا ورقية 1% في الصباح الباكر.
2. **اصفرار بين عروق الأوراق الجديدة (العليا):** هذا نقص **حديد أو ماغنسيوم** ناتج غالباً عن قلوية التربة (ارتفاع الـ pH فوق 7.5)، ويُعالج برشة عناصر صغرى مخلبية (EDDHA).
3. **اصفرار مع ذبول عام:** ناتج عن عفن جذور أو عطش أو ملوحة مياه زائدة. افحص الجذور لو فيها سواد أو رائحة غير طبيعية.`;
  }

  if (qLower.includes('ري') || qLower.includes('مياه') || qLower.includes('عطش')) {
    return `بناءً على بيانات قمر **NASA SMAP** وتوقعات **Open-Meteo**:
- رطوبة التربة الحالية تسجل **0.24 م³/م³**، وهو مؤشر على بداية الإجهاد المائي.
- موجة حرارة قادمة خلال الـ 48 ساعة القادمة (ستتجاوز 36°C).
- **التوصية:** ابدأ ري الأرض غداً بعد العصر أو في المساء. تجنب تماماً الري في وقت الظهيرة لأن حرارة التربة المرتفعة تسبب اختناق الجذور وأمراض الذبول.`;
  }

  if (qLower.includes('قمح') || qLower.includes('صدأ') || qLower.includes('تفريع')) {
    return `بخصوص محصول القمح في هذا التوقيت:
- مرحلة **التفريع ونمو السنابل** تحتاج لعنصر الفوسفور لتنشيط الجذور، مع دفعة التسميد الأزوتي الثانية.
- **تنبيه هام للصدأ الأصفر:** افحص قلب الحقل باستمرار، لو لاحظت بقع صفراء دقيقة تترك بودرة صفراء على الأصابع، رش فوراً مبيد فطري معتمد (مثل تيبوكونازول أو أزوكستروبين) ولا تتأخر يوماً واحداً.`;
  }

  if (qLower.includes('سماد') || qLower.includes('فوسفور') || qLower.includes('بوتاسيوم') || qLower.includes('تسميد')) {
    return `برنامج التسميد الموصى به وفقاً لتحليل التربة المسجل:
1. **التربة تميل للقلوية (pH 7.8):** استخدم دائماً أسمدة ذات تأثير حامضي مثل حمض الفوسفوريك وسلفات البوتاسيوم وسلفات الأمونيوم لخفض الـ pH حول الجذور وتسهيل الامتصاص.
2. **البوتاسيوم:** ضروري جداً قبل موجات الحرارة لأنه ينظم فتح وغلق الثغور في الورقة ويمنع جفاف النبات.`;
  }

  return `أهلاً يا حاج! سؤالك ممتاز. لتحسين التوصية:
- نوع المحصول وعمره الحالي.
- هل قمت بالري مؤخراً أم الأرض جافة؟
- إذا كان هناك أعراض على النبات، يمكنك التقاط صورة للورقة من قسم **(دكتور النبات)** وسأقوم بفحصها فوراً.

*(💡 ملحوظة: يمكنك ربط مفتاح Gemini API في الإعدادات لتفعيل الذكاء الاصطناعي التوليدي الكامل بأحدث البيانات الحية!)*`;
}

// Chat Send Action
async function sendChatMessage() {
  const ci = $('ci');
  const val = ci.value.trim();
  if (!val) return;

  chatHistory.push({ role: 'user', text: val });
  setStorage('chat_history', chatHistory);
  ci.value = '';
  renderActiveView();

  const chatContainer = $('ch');
  if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;

  // Add Thinking Placeholder
  chatHistory.push({ role: 'model', text: '⏳ جاري استشارة بيانات الأقمار الصناعية وتحليل التربة…' });
  renderActiveView();

  try {
    const reply = await callAI(val);
    chatHistory[chatHistory.length - 1] = { role: 'model', text: reply };
  } catch(err) {
    chatHistory[chatHistory.length - 1] = {
      role: 'model',
      text: `⚠️ عذراً يا حاج، حدث خطأ أثناء الاتصال بالـ AI: (${err.message}). تم التبديل للمستشار المحلي:` + '\n\n' + generateBuiltinAgriResponse(val)
    };
  }

  setStorage('chat_history', chatHistory);
  renderActiveView();
  const c2 = $('ch');
  if (c2) c2.scrollTop = c2.scrollHeight;
}

function saveNewFarm() {
  const name = $('newFarmName').value.trim();
  const crop = $('newFarmCrop').value.trim();
  const area = parseFloat($('newFarmArea').value) || 1;
  const stage = $('newFarmStage').value;

  if (!name || !crop) {
    alert(L === 'ar' ? 'من فضلك أدخل اسم الأرض والمحصول' : 'Please provide farm name and crop');
    return;
  }

  // Create offset coordinates around current base location
  const baseLat = coords.lat + (Math.random() - 0.5) * 0.02;
  const baseLon = coords.lon + (Math.random() - 0.5) * 0.02;
  const polyCoords = [
    [baseLat, baseLon],
    [baseLat + 0.005, baseLon + 0.002],
    [baseLat + 0.004, baseLon + 0.008],
    [baseLat - 0.001, baseLon + 0.006]
  ];

  const newFarm = {
    id: Date.now(),
    name: name,
    nameEn: name,
    crop: crop,
    cropEn: crop,
    area: area,
    stage: stage,
    stageEn: stage,
    progress: 30,
    ndvi: (0.60 + Math.random() * 0.25).toFixed(2),
    coords: polyCoords
  };

  // Sync with secure backend server
  fetch('/api/farms', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, crop, area, stage, coords: polyCoords })
  }).then(r => r.json()).then(d => {
    if (d.success && d.farm_id) newFarm.id = d.farm_id;
  }).catch(() => {});

  farmsData.push(newFarm);
  setStorage('farms', farmsData);
  closeModal();
  renderActiveView();
}

function deleteFarm(id) {
  if (confirm(L === 'ar' ? 'هل أنت متأكد من حذف هذه الأرض؟' : 'Delete this farm field?')) {
    farmsData = farmsData.filter(f => f.id !== id);
    setStorage('farms', farmsData);
    fetch('/api/farms/' + id, { method: 'DELETE' }).catch(() => {});
    renderActiveView();
  }
}

function saveLocationSettings() {

function detectUserLocation() {
  if (!navigator.geolocation) {
    alert(L === 'ar' ? 'المتصفح لا يدعم تحديد الموقع الجغرافي' : 'Geolocation not supported');

  }
  navigator.geolocation.getCurrentPosition((pos) => {
    $('setLat').value = pos.coords.latitude.toFixed(4);
    $('setLon').value = pos.coords.longitude.toFixed(4);
    $('setName').value = L === 'ar' ? 'موقعي المباشر (GPS)' : 'My Live Location (GPS)';
    saveLocationSettings();
  }, (err) => {
    alert(L === 'ar' ? 'تعذر جلب موقع GPS: ' + err.message : 'GPS Error: ' + err.message);

function updateLocationHeader() {

const viewKeys = ["dash", "farms", "sat", "soil", "doc", "wx", "bot", "cal", "irr", "rep", "set"];

function toggleSidebar(forceState) {
  const sb = $("sb");
  const backdrop = $("sbBackdrop");
  if (innerWidth < 1024) {
    const isOpen = forceState !== undefined ? forceState : !sb.classList.contains("o");
    sb.classList.toggle("o", isOpen);
    if (backdrop) backdrop.classList.toggle("active", isOpen);
  } else {
    sb.classList.toggle("c");
  }
}

function navigateTab(idx) {
  cur = idx;
  setStorage('last_tab', cur);

function renderActiveView() {
  document.documentElement.lang = L;
  document.documentElement.dir = L === "ar" ? "rtl" : "ltr";

  // Sidebar Buttons
  const navContainer = $("nav");
  navContainer.innerHTML = t("n").map((name, i) => `
    <button data-idx="${i}" ${i === cur ? 'aria-current="page"' : ''} onclick="navigateTab(${i})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="${IC[i]}"/>
      </svg>
      <span class="lb">${name}</span>
    </button>
  `).join("");

  // Header Texts
  $("ttl").textContent = t("n")[cur];
  $("tag").textContent = t("tag");
  $("fabText").textContent = t("fab");
  $("lg").textContent = L === "en" ? "عربي" : "English";
  $("brandSub").textContent = L === "ar" ? "الزراعة الذكية & NASA" : "Smart Farming & NASA Data";
  updateLocationHeader();

  // Render View HTML
  const viewFn = R[viewKeys[cur]];
  if (viewFn) {
    $("v").innerHTML = viewFn();
  }

  // Post-render attachments (Maps, Charts, Speech, Animations)
  attachViewComponents();
}

function attachViewComponents() {
  // Initialize Maps when on Dashboard, Farms, or Satellite views
  if (cur === 0) {
    setTimeout(() => { initLeafletMap('dashMap'); }, 100);
  } else if (cur === 1) {
    setTimeout(() => { initLeafletMap('farmsMap'); }, 100);
  } else if (cur === 2) {
    setTimeout(() => { initLeafletMap('satMap'); }, 100);
  } else if (cur === 5) {
    setTimeout(() => { initWeatherChart(); }, 100);
  } else if (cur === 9) {
    setTimeout(() => { initReportsCharts(); }, 100);
  }

  // Trigger Dynamic UI Animations
  initScrollReveal();
  initCountUp();
  animateProgressBars();

  // Wire AI Chat input events
  const cs = $("cs");
  if (cs) {
    cs.onclick = sendChatMessage;
    $("ci").onkeydown = (e) => {
      if (e.key === 'Enter') sendChatMessage();
    };
  }

  // Wire Speech Recognition (Voice Input)
  const mc = $("mc");
  if (mc) {
    mc.onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert(L === 'ar' ? 'التعرف الصوتي غير مدعوم في متصفحك، استخدم Chrome أو Edge.' : 'Voice recognition not supported in this browser.');
        return;
      }
      const recognition = new SR();
      recognition.lang = L === 'ar' ? 'ar-EG' : 'en-US';
      mc.textContent = "🎙️ يستمع…";
      recognition.onresult = (evt) => {
        $("ci").value = evt.results[0][0].transcript;
        sendChatMessage();
      };
      recognition.onerror = () => {
        mc.textContent = "🎤 " + t("mic");
      };
      recognition.onend = () => {
        mc.textContent = "🎤 " + t("mic");
      };
      recognition.start();
    };
  }

  // Wire Irrigation Calculator
  const calcSelect = $('calcFarmSelect');
  if (calcSelect) {
    const updateCalc = () => {
      const area = parseFloat($('calcFarmSelect').value) || 1;
      const method = $('calcMethodSelect').value;
      let multiplier = 5.5; // modern flood
      if (method === 'drip') multiplier = 3.2;
      if (method === 'pivot') multiplier = 4.1;
      const hours = (area * multiplier).toFixed(1);
      $('calcResult').textContent = L === 'ar' 
        ? `${hours} ساعات تشغيل لطلمبة الري (${Math.round(area * 320)} م³ إجمالي)`
        : `${hours} hours pump operation (~${Math.round(area * 320)} m³ total)`;
    };
    $('calcFarmSelect').onchange = updateCalc;
    $('calcMethodSelect').onchange = updateCalc;
    updateCalc();
  }
}

// ----------------- Micro-Interactions & Animation Utilities -----------------

function initScrollReveal() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('revealed'));
    return;
  }
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal:not(.revealed)').forEach(el => observer.observe(el));
}

function initCountUp() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.stat b[data-val]').forEach(el => {
    const target = parseFloat(el.dataset.val);
    if (isNaN(target)) return;
    let current = 0;
    const step = Math.max(target / 24, 0.05);
    const isInt = target % 1 === 0;
    const timer = setInterval(() => {
      current += step;
      if (current >= target) {
        el.textContent = isInt ? target : target.toFixed(2);
        clearInterval(timer);
      } else {
        el.textContent = isInt ? Math.floor(current) : current.toFixed(2);
      }
    }, 22);
  });
}

function animateProgressBars() {
  document.querySelectorAll('.bar i[data-target]').forEach(b => {
    setTimeout(() => {
      b.style.width = b.dataset.target + '%';
    }, 150);
  });
}

// Global Click Ripple Feedback
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn, .fab');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const circle = document.createElement('span');
  const diameter = Math.max(rect.width, rect.height);
  const radius = diameter / 2;
  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${e.clientX - rect.left - radius}px`;
  circle.style.top = `${e.clientY - rect.top - radius}px`;
  circle.classList.add('ripple-effect');
  const oldRipple = btn.querySelector('.ripple-effect');
  if (oldRipple) oldRipple.remove();
  btn.appendChild(circle);
  setTimeout(() => circle.remove(), 450);
});

// Authentication & Session Management
let currentUser = null;
let authMode = 'login'; // 'login' or 'register'

async function checkAuthSession() {
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated && data.user) {
        currentUser = data.user;
        const authLbl = $('authLabel');
        if (authLbl) authLbl.textContent = currentUser.full_name || currentUser.email.split('@')[0];
        
        // Sync user farms from server
        const fRes = await fetch('/api/farms');
        if (fRes.ok) {
          const fData = await fRes.json();
          if (fData.farms && fData.farms.length > 0) {
            farmsData = fData.farms;
            setStorage('farms', farmsData);
          }
        }

        // Sync user tasks from server
        const tRes = await fetch('/api/tasks');
        if (tRes.ok) {
          const tData = await tRes.json();
          if (tData.tasks) {
            for (const [idx, val] of Object.entries(tData.tasks)) {
              done[idx] = val ? 1 : 0;
            }
            setStorage('tasks', done);
          }
        }
        renderActiveView();
      }
    }
  } catch(e) {}
}

function openAuthModal() {
  if (currentUser) {
    const roleTxt = currentUser.role === 'admin' ? (L === 'ar' ? 'مسؤول (Admin)' : 'Admin') : (L === 'ar' ? 'مزارع' : 'Farmer');
    if (confirm(L === 'ar' 
      ? `أنت مسجل حالياً باسم: ${currentUser.full_name}\nالرتبة: ${roleTxt}\nالبريد: ${currentUser.email}\n\nهل تريد تسجيل الخروج؟`
      : `Logged in as ${currentUser.full_name} (${roleTxt}). Sign out?`)) {
      fetch('/api/auth/logout', { method: 'POST' }).then(() => {
        currentUser = null;
        const authLbl = $('authLabel');
        if (authLbl) authLbl.textContent = L === 'ar' ? 'دخول / حساب' : 'Login';
        alert(L === 'ar' ? 'تم تسجيل الخروج بنجاح.' : 'Signed out.');
        location.reload();
      });
    }
    return;
  }

  const m = $('modalBox');
  m.style.display = 'flex';
  m.className = 'modal-overlay';
  authMode = 'login';
  renderAuthModalContent();
}

function renderAuthModalContent() {
  const m = $('modalBox');
  m.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0">🔒 ${authMode === 'login' ? (L==='ar'?'تسجيل الدخول الآمن':'Secure Login') : (L==='ar'?'إنشاء حساب مزارع جديد':'New Account')}</h3>
        <button class="btn sm" onclick="closeModal()">✕</button>
      </div>

      <div style="display:flex;gap:6px;margin-bottom:14px">
        <button class="btn sm ${authMode === 'login' ? 'p' : ''}" onclick="toggleAuthTab('login')">${L==='ar'?'تسجيل الدخول':'Sign In'}</button>
        <button class="btn sm ${authMode === 'register' ? 'p' : ''}" onclick="toggleAuthTab('register')">${L==='ar'?'حساب جديد':'Register'}</button>
      </div>

      <div id="authRegFields" style="display:${authMode === 'register' ? 'block' : 'none'}" class="form-group">
        <label>${L==='ar'?'الاسم بالكامل:':'Full Name:'}</label>
        <input type="text" id="authName" placeholder="مثال: الحاج أحمد عبد الرحمن">
      </div>

      <div class="form-group">
        <label>${L==='ar'?'البريد الإلكتروني:':'Email:'}</label>
        <input type="text" id="authEmail" placeholder="farmer@agrimate.org" autocomplete="username">
      </div>

      <div class="form-group">
        <label>${L==='ar'?'كلمة المرور (8 أحرف فأكثر):':'Password (8+ chars):'}</label>
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div id="authAlert" style="display:none;margin-top:10px" class="alert b"></div>

      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn p" id="authSubmitBtn" onclick="submitAuthForm()">🚀 ${authMode === 'login' ? (L==='ar'?'دخول':'Sign In') : (L==='ar'?'تسجيل حساب':'Create Account')}</button>
        <button class="btn" onclick="closeModal()">${L==='ar'?'إلغاء':'Cancel'}</button>
      </div>
      <div class="meta" style="margin-top:12px;font-size:11.5px">
        🛡️ مشفر بـ PBKDF2 (600,000 دورة) • حماية ضد محاولات الاختراق والقوة الغاشمة (Rate Limiting) • عزل تام للبيانات
      </div>
    </div>
  `;
}

function toggleAuthTab(mode) {
  authMode = mode;
  renderAuthModalContent();
}

async function submitAuthForm() {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const alertBox = $('authAlert');
  alertBox.style.display = 'none';

  if (!email || !password) {
    alertBox.textContent = L === 'ar' ? 'يرجى إدخال البريد الإلكتروني وكلمة المرور' : 'Email and password required';
    alertBox.style.display = 'block';
    return;
  }

  const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
  const payload = { email, password };
  if (authMode === 'register') {
    payload.full_name = $('authName').value.trim() || email.split('@')[0];
  }

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      alertBox.textContent = data.error || (L === 'ar' ? 'فشل تسجيل الدخول' : 'Authentication failed');
      alertBox.style.display = 'block';
      return;
    }

    currentUser = data.user;
    closeModal();
    const authLbl = $('authLabel');
    if (authLbl) authLbl.textContent = currentUser.full_name || currentUser.email.split('@')[0];
    alert(L === 'ar' ? `مرحباً بك يا ${currentUser.full_name}! تم الدخول بأمان.` : `Welcome ${currentUser.full_name}!`);
    await checkAuthSession();
    renderActiveView();
  } catch(e) {
    alertBox.textContent = L === 'ar' ? 'تعذر الاتصال بالسيرفر، تأكد من تشغيل server.py' : 'Cannot connect to server. Ensure server.py is running.';
    alertBox.style.display = 'block';
  }
}

// Initial App Boot
(async function initApp() {
  // Restore Theme
  const savedTheme = getStorage('theme', 'light');
  document.documentElement.dataset.theme = savedTheme;

  // Check backend session
  checkAuthSession();

  // Initial Fetch (Async in background without blocking UI)
  fetchOpenMeteoWeather(coords.lat, coords.lon).then(() => {
    if (cur === 0 || cur === 5) renderActiveView();
  });
  fetchNASAPowerData(coords.lat, coords.lon).then(() => {
    if (cur === 0 || cur === 2) renderActiveView();
  });

  renderActiveView();
})();
</script>
